<!-- ═══════════════════════════════════════════════════════════════════════════
     COCKPIT OS — ONGLET RACCOURCIS (SHORTCUTS TAB)
     Grille en 4 zones fixes (pas de scroll) : Apps rapides (haut-gauche),
     Macros (haut-droite), Jeux (bas-gauche, paginé), Système
     (bas-droite). Voir Design_code/refonte-ui-2026.md pour la référence
     visuelle. La logique/les données (ShortcutsController, shortcuts.js)
     sont inchangées par cette refonte — seuls le balisage et les classes
     changent.
     ═══════════════════════════════════════════════════════════════════════════ -->
<div class="rc-shell">
  <div class="rc-grid">

    <!-- HAUT GAUCHE : APPS RAPIDES -->
    <div class="rc-panel">
      <div class="rc-panel__head">
        <span class="rc-panel__title">Apps rapides</span>
      </div>
      <div class="rc-apps-grid" id="shortcuts-dock-apps">
        <div class="rc-status-msg">
          <div class="loading-ring"></div>
          <span>Chargement...</span>
        </div>
      </div>
      <div class="rc-pager is-hidden" id="shortcuts-apps-pager"></div>
    </div>

    <!-- HAUT DROITE : MACROS -->
    <div class="rc-panel">
      <div class="rc-panel__head">
        <span class="rc-panel__title">Macros</span>
      </div>
      <div class="rc-macro-grid" id="shortcuts-scenes-list">
        <div class="rc-status-msg">
          <div class="loading-ring"></div>
          <span>Chargement...</span>
        </div>
      </div>
    </div>

    <!-- BAS GAUCHE : JEUX (entrées "type":"game" de shortcuts_config.json,
         gérées depuis l'app compagnon — plus de détection Steam auto) -->
    <div class="rc-panel">
      <div class="rc-panel__head">
        <span class="rc-panel__title">Jeux</span>
      </div>
      <div class="rc-games-grid" id="shortcuts-games-grid">
        <div class="rc-status-msg">
          <div class="loading-ring"></div>
          <span>Chargement...</span>
        </div>
      </div>
      <div class="rc-pager is-hidden" id="shortcuts-games-pager"></div>
    </div>

    <!-- BAS DROITE : ACTIONS SYSTÈME -->
    <div class="rc-panel">
      <div class="rc-panel__head">
        <span class="rc-panel__title">Actions système</span>
      </div>
      <div class="rc-actions-grid">
        <button class="rc-action-tile" onclick="ShortcutsController.handleSystemAction('lock')">
          <span class="rc-action-tile__icon">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M6 10V7a6 6 0 0112 0v3"/><rect x="4" y="10" width="16" height="10" rx="3"/></svg>
          </span>
          <span class="rc-action-tile__name">Verrouiller</span>
        </button>
        <button class="rc-action-tile" onclick="ShortcutsController.handleSystemAction('sleep')">
          <span class="rc-action-tile__icon">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M20 14.5A8.5 8.5 0 119.5 4a7 7 0 1010.5 10.5z"/></svg>
          </span>
          <span class="rc-action-tile__name">Veille</span>
        </button>
        <button class="rc-action-tile rc-action-tile--warm" onclick="ShortcutsController.confirmSystemAction(event, 'logoff', 'Fermer la Session')">
          <span class="rc-action-tile__icon">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M9 4H5a2 2 0 00-2 2v12a2 2 0 002 2h4"/><path d="M15 16l4-4-4-4"/><path d="M19 12H9"/></svg>
          </span>
          <span class="rc-action-tile__name">Fermer session</span>
        </button>
        <button class="rc-action-tile rc-action-tile--warm" onclick="ShortcutsController.confirmSystemAction(event, 'restart', 'Redémarrer le PC')">
          <span class="rc-action-tile__icon">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M4 12a8 8 0 1 1 2.6 5.9"/><path d="M4 17v-5h5"/></svg>
          </span>
          <span class="rc-action-tile__name">Redémarrer</span>
        </button>
        <button class="rc-action-tile rc-action-tile--danger rc-action-tile--wide" onclick="ShortcutsController.confirmSystemAction(event, 'shutdown', 'Éteindre le PC')">
          <span class="rc-action-tile__icon">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3v9"/><path d="M18.4 6.6a8 8 0 11-12.8 0"/></svg>
          </span>
          <span class="rc-action-tile__name">Éteindre</span>
        </button>
      </div>
    </div>

  </div>

  <!-- Toast de notification discret -->
  <div class="toast shortcuts-toast" id="shortcuts-toast">Message</div>
</div>

<!-- Modale de confirmation tactile pour actions critiques -->
<div class="modal-overlay" id="shortcuts-confirm-modal" onclick="if(event.target===this) ShortcutsController.closeModal()">
  <div class="modal-card">
    <div class="modal-card__header">
      <span class="modal-card__icon" style="color:var(--danger);">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M10.29 3.86L1.82 18a2 2 0 0 0 1.71 3h16.94a2 2 0 0 0 1.71-3L13.71 3.86a2 2 0 0 0-3.42 0z"/><line x1="12" y1="9" x2="12" y2="13"/><line x1="12" y1="17" x2="12.01" y2="17"/></svg>
      </span>
      <div class="modal-card__heading">
        <div class="modal-card__title" id="shortcuts-modal-title">Confirmer l'action ?</div>
      </div>
      <button class="modal-card__close" onclick="ShortcutsController.closeModal()" aria-label="Fermer">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
      </button>
    </div>
    <div class="modal-card__body">
      <p class="shortcuts-modal-text" id="shortcuts-modal-subtitle">
        Êtes-vous sûr de vouloir exécuter cette action système sur le PC ?
      </p>
    </div>
    <div class="modal-card__footer">
      <button class="btn btn--block" onclick="ShortcutsController.closeModal()">Annuler</button>
      <button class="btn btn--primary btn--block" id="shortcuts-modal-confirm-btn">Confirmer</button>
    </div>
  </div>
</div>

<!-- ═══════════════════════════════════════════════════════════════════════════
     COCKPIT OS — ONGLET RACCOURCIS (SHORTCUTS TAB)
     Structure à 2 colonnes avec widget MFD_Raccourcis à onglets internes
     ═══════════════════════════════════════════════════════════════════════════ -->
<div class="shortcuts-tab-container">
  <div class="shortcuts-grid-layout">

    <!-- Colonne Gauche (~35% de largeur, empilée verticalement) -->
    <div class="shortcuts-col-left">

      <!-- Zone 1: Apps_Rapides -->
      <div class="shortcuts-zone shortcuts-zone--apps">
        <div class="shortcuts-zone-header">
          <div class="shortcuts-zone-title">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
              <rect x="3" y="3" width="7" height="7" rx="1.5"/>
              <rect x="14" y="3" width="7" height="7" rx="1.5"/>
              <rect x="14" y="14" width="7" height="7" rx="1.5"/>
              <rect x="3" y="14" width="7" height="7" rx="1.5"/>
            </svg>
            Apps Rapides
          </div>
          <span class="shortcuts-zone-badge">Bureautique</span>
        </div>

        <div class="shortcuts-zone-body">
          <div class="shortcuts-apps-grid" id="shortcuts-apps-grid">
            <div class="shortcuts-status-msg">
              <div class="shortcuts-spinner"></div>
              <span>Chargement des applications...</span>
            </div>
          </div>
        </div>
      </div>

      <!-- Zone 3: Actions_Systeme -->
      <div class="shortcuts-zone shortcuts-zone--system">
        <div class="shortcuts-zone-header">
          <div class="shortcuts-zone-title">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
              <path d="M18.36 6.64a9 9 0 1 1-12.73 0"/>
              <line x1="12" y1="2" x2="12" y2="12"/>
            </svg>
            Actions Système
          </div>
          <span class="shortcuts-zone-badge">Contrôle PC</span>
        </div>

        <div class="shortcuts-zone-body">
          <div class="shortcuts-system-grid">
            <button class="shortcuts-sysbtn shortcuts-sysbtn--neutral" onclick="ShortcutsController.handleSystemAction('lock')">
              <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2">
                <rect x="3" y="11" width="18" height="11" rx="2" ry="2"/>
                <path d="M7 11V7a5 5 0 0 1 10 0v4"/>
              </svg>
              <span>Verrouiller</span>
            </button>

            <button class="shortcuts-sysbtn shortcuts-sysbtn--neutral" onclick="ShortcutsController.handleSystemAction('sleep')">
              <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2">
                <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/>
              </svg>
              <span>Mettre en Veille</span>
            </button>

            <button class="shortcuts-sysbtn shortcuts-sysbtn--warning" onclick="ShortcutsController.confirmSystemAction('logoff', 'Fermer la Session')">
              <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2">
                <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/>
                <polyline points="16 17 21 12 16 7"/>
                <line x1="21" y1="12" x2="9" y2="12"/>
              </svg>
              <span>Fermer Session</span>
            </button>

            <button class="shortcuts-sysbtn shortcuts-sysbtn--danger" onclick="ShortcutsController.confirmSystemAction('restart', 'Redémarrer le PC')">
              <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2">
                <path d="M21.5 2v6h-6"/>
                <path d="M21.34 15.57a10 10 0 1 1-.57-8.38l5.67-5.67"/>
              </svg>
              <span>Redémarrer</span>
            </button>

            <button class="shortcuts-sysbtn shortcuts-sysbtn--danger" onclick="ShortcutsController.confirmSystemAction('shutdown', 'Éteindre le PC')">
              <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2">
                <path d="M18.36 6.64a9 9 0 1 1-12.73 0"/>
                <line x1="12" y1="2" x2="12" y2="12"/>
              </svg>
              <span>Éteindre</span>
            </button>
          </div>
        </div>
      </div>

    </div>

    <!-- Colonne Droite (~65% de largeur) : Widget MFD_Raccourcis -->
    <div class="shortcuts-col-right shortcuts-mfd-widget">
      <!-- Barre d'onglets fixe en haut du widget MFD -->
      <div class="shortcuts-mfd-tabs">
        <button class="shortcuts-mfd-tab-btn is-active" id="mfd-tab-btn-steam" onclick="ShortcutsController.switchSubTab('steam')">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2">
            <path d="M6 11h4M8 9v4M15 12h.01M18 10h.01"/>
            <rect x="2" y="6" width="20" height="12" rx="4"/>
          </svg>
          <span>STEAM</span>
        </button>

        <button class="shortcuts-mfd-tab-btn" id="mfd-tab-btn-windows" onclick="ShortcutsController.switchSubTab('windows')">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2">
            <rect x="2" y="4" width="20" height="16" rx="2"/>
            <path d="M10 4v16"/>
          </svg>
          <span>FENÊTRES</span>
        </button>

        <button class="shortcuts-mfd-tab-btn" id="mfd-tab-btn-scenes" onclick="ShortcutsController.switchSubTab('scenes')">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2">
            <polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2"/>
          </svg>
          <span>SCÈNES</span>
        </button>
      </div>

      <!-- Zone de contenu active en pleine largeur/hauteur -->
      <div class="shortcuts-mfd-content">
        <!-- Contenu Onglet Steam -->
        <div class="shortcuts-mfd-pane is-active" id="mfd-pane-steam">
          <div class="shortcuts-scrollable-list" id="shortcuts-steam-list">
            <div class="shortcuts-status-msg">
              <div class="shortcuts-spinner"></div>
              <span>Chargement des jeux...</span>
            </div>
          </div>
        </div>

        <!-- Contenu Onglet Fenêtres -->
        <div class="shortcuts-mfd-pane" id="mfd-pane-windows">
          <div class="shortcuts-scrollable-list" id="shortcuts-windows-list">
            <div class="shortcuts-status-msg">
              <div class="shortcuts-spinner"></div>
              <span>Recherche des fenêtres...</span>
            </div>
          </div>
        </div>

        <!-- Contenu Onglet Scènes -->
        <div class="shortcuts-mfd-pane" id="mfd-pane-scenes">
          <div class="shortcuts-scrollable-list" id="shortcuts-scenes-grid">
            <div class="shortcuts-status-msg">
              <div class="shortcuts-spinner"></div>
              <span>Chargement des scènes...</span>
            </div>
          </div>
        </div>
      </div>
    </div>

  </div>

  <!-- Toast de notification discret -->
  <div class="shortcuts-toast" id="shortcuts-toast">Message</div>
</div>

<!-- Modale de Confirmation Tactile Plein Écran pour Actions Critiques -->
<div class="shortcuts-modal-overlay" id="shortcuts-confirm-modal">
  <div class="shortcuts-modal-card">
    <div class="shortcuts-modal-icon">
      <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2">
        <path d="M10.29 3.86L1.82 18a2 2 0 0 0 1.71 3h16.94a2 2 0 0 0 1.71-3L13.71 3.86a2 2 0 0 0-3.42 0z"/>
        <line x1="12" y1="9" x2="12" y2="13"/>
        <line x1="12" y1="17" x2="12.01" y2="17"/>
      </svg>
    </div>
    <div class="shortcuts-modal-title" id="shortcuts-modal-title">Confirmer Action ?</div>
    <div class="shortcuts-modal-subtitle" id="shortcuts-modal-subtitle">
      Êtes-vous sûr de vouloir exécuter cette action système sur le PC ?
    </div>
    <div class="shortcuts-modal-actions">
      <button class="shortcuts-modal-btn shortcuts-modal-btn--cancel" onclick="ShortcutsController.closeModal()">
        Annuler
      </button>
      <button class="shortcuts-modal-btn shortcuts-modal-btn--confirm" id="shortcuts-modal-confirm-btn">
        Confirmer
      </button>
    </div>
  </div>
</div>

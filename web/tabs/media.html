<!-- ══ Onglet Lecteur Multimédia & Mixeur Audio (Restructuré) ═════════════════════
     Interface haut de gamme à deux colonnes optimisée pour Samsung Galaxy Tab A8.
     ════════════════════════════════════════════════════════════════════════ -->

<div class="media-layout-container">
  
  <!-- COLONNE GAUCHE : Lecteur Multimédia Principal (Dégradé Violet-Indigo) -->
  <div class="widget-media-player-main-glass">
    
    <!-- Grande Pochette d'Album -->
    <div class="media-cover-container">
      <img id="media-cover-img" class="media-cover-img" src="" alt="Pochette" />
      <div id="media-cover-placeholder" class="media-cover-placeholder">♪</div>
    </div>

    <!-- Informations Métadonnées -->
    <div class="media-meta-container">
      <div id="media-player-name" class="media-source-name">🎵 Deezer Desktop</div>
      <h2 id="media-title" class="media-title-text">Aucune lecture</h2>
      <p id="media-artist" class="media-artist-text">—</p>
    </div>

    <!-- Barre de progression seekable -->
    <div class="media-progress-container">
      <span class="media-time-label" id="media-pos">0:00</span>
      <div class="media-progress-bar-wrapper" id="media-progress-bar" title="Cliquer pour naviguer">
        <div class="media-progress-bar-fill" id="media-progress-fill"></div>
      </div>
      <span class="media-time-label" id="media-dur">0:00</span>
    </div>

    <!-- Contrôles de lecture complets -->
    <div class="media-controls-row">
      <button class="media-icon-btn" id="media-shuffle" title="Aléatoire">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="20" height="20">
          <polyline points="16 3 21 3 21 8"/>
          <line x1="4" y1="20" x2="21" y2="3"/>
          <polyline points="21 16 21 21 16 21"/>
          <line x1="15" y1="15" x2="21" y2="21"/>
          <line x1="4" y1="4" x2="9" y2="9"/>
        </svg>
      </button>

      <button class="media-icon-btn" id="media-prev" title="Précédent">
        <svg viewBox="0 0 24 24" fill="currentColor" width="20" height="20">
          <polygon points="19 20 9 12 19 4 19 20"/>
          <line x1="5" y1="19" x2="5" y2="5" stroke="currentColor" stroke-width="2"/>
        </svg>
      </button>

      <button class="media-play-btn-large" id="media-play" title="Lecture / Pause">
        <svg viewBox="0 0 24 24" fill="currentColor" width="24" height="24" id="media-play-icon">
          <polygon points="5 3 19 12 5 21 5 3"/>
        </svg>
      </button>

      <button class="media-icon-btn" id="media-next" title="Suivant">
        <svg viewBox="0 0 24 24" fill="currentColor" width="20" height="20">
          <polygon points="5 4 15 12 5 20 5 4"/>
          <line x1="19" y1="5" x2="19" y2="19" stroke="currentColor" stroke-width="2"/>
        </svg>
      </button>

      <button class="media-icon-btn" id="media-repeat" title="Répéter">
        <svg id="media-repeat-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="20" height="20">
          <polyline points="17 1 21 5 17 9"/>
          <path d="M3 11V9a4 4 0 0 1 4-4h14"/>
          <polyline points="7 23 3 19 7 15"/>
          <path d="M21 13v2a4 4 0 0 1-4 4H3"/>
        </svg>
      </button>
    </div>

    <!-- Slider Volume Principal (avec icône mute cliquable à côté) -->
    <div class="media-volume-container">
      <button class="sim-mixer-icon-btn" id="media-mute" onclick="toggleAppMute('master')" title="Couper / Rétablir le son général" style="width:38px!important;height:38px!important;min-width:38px!important;border-radius:50%!important;margin-right:8px;">
        <svg viewBox="0 0 24 24" fill="currentColor">
          <path d="M3 9v6h4l5 5V4L7 9H3zm13.5 3c0-1.77-1.02-3.29-2.5-4.03v8.05c1.48-.73 2.5-2.25 2.5-4.02zM14 3.23v2.06c2.89.86 5 3.54 5 6.71s-2.11 5.85-5 6.71v2.06c4.01-.91 7-4.49 7-8.77s-2.99-7.86-7-8.77z"/>
        </svg>
      </button>
      <input type="range" class="media-volume-slider audio-app-slider-modern" id="media-tab-volume-slider" min="0" max="100" value="100" title="Volume principal" oninput="setAppVolume('master', this.value)" onchange="setAppVolumeCommit('master', this.value)" />
    </div>

  </div>

  <!-- COLONNE DROITE : Deux modules empilés -->
  <div class="media-right-panel">
    
    <!-- Module 1: Mixeur de volume -->
    <div class="widget-card">
      <div class="widget-header">
        <span class="widget-title">Mixeur de volume</span>
      </div>
      <div class="widget-content">
        <div class="apps-volume-content" id="audio-apps-list">
          <p class="empty-state">Chargement du mixeur audio...</p>
        </div>
      </div>
    </div>

    <!-- Module 2: Bluetooth -->
    <div class="widget-card">
      <div class="widget-header" style="display:flex; align-items:center; justify-content:space-between;">
        <div style="display:flex; align-items:center; gap:8px;">
          <span class="widget-title">Bluetooth</span>
          <span id="bluetooth-status-badge" class="bluetooth-status-badge">Activé</span>
        </div>
        <div style="display:flex; align-items:center; gap:8px;">
          <label class="bluetooth-toggle-switch" title="Activer / Désactiver le Bluetooth">
            <input type="checkbox" id="bluetooth-power-toggle" checked onchange="UI.toggleBluetoothPower(this.checked)" />
            <span class="bluetooth-slider"></span>
          </label>
        </div>
      </div>
      <div class="widget-content">
        <div class="bluetooth-list" id="bluetooth-devices-list">
          <!-- Injecté par app.js -->
        </div>
      </div>
    </div>

  </div>

</div>

<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="Cockpit OS — Interface multimédia tactile" />
  <title>Cockpit OS</title>
  <link rel="stylesheet" href="/css/design-tokens.css?v=__APP_VERSION__" />
  <link rel="stylesheet" href="/css/style.css?v=__APP_VERSION__" />
  <link rel="stylesheet" href="/css/shortcuts.css?v=__APP_VERSION__" />
</head>
<body>
  <script>window.APP_VERSION = "__APP_VERSION__";</script>

  <!-- ══ En-tête ══════════════════════════════════════════════════════════ -->
  <header class="header">
    <div class="header__logo">
      <svg class="header__icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <circle cx="12" cy="12" r="10"/>
        <circle cx="12" cy="12" r="3"/>
        <line x1="12" y1="2" x2="12" y2="5"/>
        <line x1="12" y1="19" x2="12" y2="22"/>
        <line x1="2" y1="12" x2="5" y2="12"/>
        <line x1="19" y1="12" x2="22" y2="12"/>
      </svg>
      <span>Cockpit OS</span>
    </div>

    <div class="header__status">
      <span id="ws-status" class="status-badge status-badge--disconnected">
        <span class="status-badge__dot"></span>
        Connexion…
      </span>
    </div>

    <div class="header__clock" id="clock">--:--</div>
  </header>

  <!-- ══ Corps : sidebar verticale + contenu ══════════════════════════════ -->
  <div class="app-body">

    <!-- Navigation verticale à gauche -->
    <nav class="tab-nav">
      <button class="tab-nav__btn" data-tab="shortcuts">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <rect x="3" y="3" width="7" height="7" rx="1.5"/>
          <rect x="14" y="3" width="7" height="7" rx="1.5"/>
          <rect x="14" y="14" width="7" height="7" rx="1.5"/>
          <rect x="3" y="14" width="7" height="7" rx="1.5"/>
        </svg>
        <span class="tab-nav__label">Raccourcis</span>
      </button>
      <button class="tab-nav__btn" data-tab="media">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"/>
          <path d="M15.54 8.46a5 5 0 0 1 0 7.07"/>
          <path d="M19.07 4.93a10 10 0 0 1 0 14.14"/>
        </svg>
        <span class="tab-nav__label">Médias</span>
      </button>
      <button class="tab-nav__btn" data-tab="deezer">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M9 18V5l12-2v13"/>
          <circle cx="6" cy="18" r="3"/>
          <circle cx="18" cy="16" r="3"/>
        </svg>
        <span class="tab-nav__label">Deezer</span>
      </button>

      <!-- Groupe "Automobile" : bouton dépliant → Endurance / Cockpit -->
      <div class="tab-nav__group" id="nav-group-automobile">
        <button type="button" class="tab-nav__btn tab-nav__btn--group tab-nav__btn--active" id="nav-toggle-automobile" aria-expanded="false">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <circle cx="12" cy="13" r="8"/>
            <path d="M12 9v4l2.5 2.5"/>
            <path d="M12 2v3"/>
            <path d="M10 2h4"/>
          </svg>
          <span class="tab-nav__label">Automobile</span>
          <svg class="tab-nav__chevron" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round">
            <polyline points="6 9 12 15 18 9"/>
          </svg>
        </button>
        <div class="tab-nav__submenu" id="nav-submenu-automobile">
          <button class="tab-nav__btn tab-nav__btn--sub" data-tab="endurance">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <circle cx="12" cy="13" r="8"/>
              <path d="M12 9v4l2.5 2.5"/>
              <path d="M12 2v3"/>
              <path d="M10 2h4"/>
            </svg>
            <span class="tab-nav__label">Endurance</span>
          </button>
          <button class="tab-nav__btn tab-nav__btn--sub tab-nav__btn--active" data-tab="dashboard">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <rect x="3" y="3" width="7" height="7" rx="1.5"/>
              <rect x="14" y="3" width="7" height="7" rx="1.5"/>
              <rect x="14" y="14" width="7" height="7" rx="1.5"/>
              <rect x="3" y="14" width="7" height="7" rx="1.5"/>
            </svg>
            <span class="tab-nav__label">Cockpit</span>
          </button>
        </div>
      </div>
    </nav>

    <!-- Contenu des onglets -->
    <main class="tab-content">

      <!-- Onglet Cockpit (Tableau de Bord) -->
      <section id="tab-dashboard" class="tab-panel tab-panel--active">
        <!-- Chargé depuis /tabs/dashboard.html -->
      </section>

      <!-- Onglet Deezer -->
      <section id="tab-deezer" class="tab-panel">
        <!-- Chargé depuis /tabs/deezer.html -->
      </section>

      <!-- Onglet Lecteur Media -->
      <section id="tab-media" class="tab-panel">
        <!-- Chargé depuis /tabs/media.html -->
      </section>

      <!-- Onglet Endurance -->
      <section id="tab-endurance" class="tab-panel">
        <!-- Chargé depuis /tabs/endurance.html -->
      </section>

      <!-- Onglet Raccourcis -->
      <section id="tab-shortcuts" class="tab-panel">
        <!-- Chargé depuis /tabs/shortcuts.html -->
      </section>

    </main>
  </div>

  <!-- ══ Mini-lecteur persistant ══════════════════════════════════════════ -->
  <footer class="mini-player" id="mini-player" style="display: none !important;">
    <div class="mini-player__cover">
      <img id="mini-cover" src="" alt="" onerror="this.style.display='none'" />
      <div class="mini-player__cover-placeholder" id="mini-cover-placeholder">♪</div>
    </div>
    <div class="mini-player__info">
      <p class="mini-player__title" id="mini-title">Aucune lecture</p>
      <p class="mini-player__artist" id="mini-artist">—</p>
    </div>
    <div class="mini-player__controls">
      <button class="ctrl-btn" id="mini-prev" title="Précédent">
        <svg viewBox="0 0 24 24" fill="currentColor"><polygon points="19 20 9 12 19 4 19 20"/><line x1="5" y1="19" x2="5" y2="5" stroke="currentColor" stroke-width="2"/></svg>
      </button>
      <button class="ctrl-btn ctrl-btn--primary" id="mini-play" title="Lecture / Pause">
        <svg viewBox="0 0 24 24" fill="currentColor" id="mini-play-icon"><polygon points="5 3 19 12 5 21 5 3"/></svg>
      </button>
      <button class="ctrl-btn" id="mini-next" title="Suivant">
        <svg viewBox="0 0 24 24" fill="currentColor"><polygon points="5 4 15 12 5 20 5 4"/><line x1="19" y1="5" x2="19" y2="19" stroke="currentColor" stroke-width="2"/></svg>
      </button>
    </div>
    <div class="mini-player__progress">
      <div class="progress-bar"><div class="progress-bar__fill" id="mini-progress"></div></div>
      <div class="progress-times">
        <span id="mini-pos">0:00</span>
        <span id="mini-dur">0:00</span>
      </div>
    </div>
  </footer>

  <script src="/js/shortcuts.js?v=__APP_VERSION__"></script>
  <script src="/js/app.js?v=__APP_VERSION__"></script>
</body>
</html>
